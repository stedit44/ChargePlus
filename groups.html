<!DOCTYPE html>
<html lang="en">
<head>

    <title>ChargeReward - Groups</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo"><div class="logo-icon">⚡</div><span>ChargeReward</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-item">Dashboard</a>
            <a href="booking.html" class="nav-item">Book</a>
            <a href="rewards.html" class="nav-item">Rewards</a>
            <a href="groups.html" class="nav-item active">Groups</a>
            <a href="impact.html" class="nav-item">Impact</a>
            <div class="nav-profile">O</div>
        </div>
    </div>
</nav>

<div class="mobile-nav">
    <a href="index.html" class="mobile-nav-item"><span>📊</span> Dashboard</a>
    <a href="booking.html" class="mobile-nav-item"><span>📍</span> Book</a>
    <a href="rewards.html" class="mobile-nav-item"><span>🎁</span> Rewards</a>
    <a href="groups.html" class="mobile-nav-item active"><span>👥</span> Groups</a>
</div>

<div class="main-content">
    <div class="page-heading">
        <h1>Community</h1>
        <p>Compete and group book.</p>
    </div>

    <div class="leaderboard-section">
        <div style="padding: 20px; border-bottom: 1px solid #f1f5f9;">
            <h3 style="margin:0; font-size:1.1rem;">Top Chargers</h3>
        </div>
        <table class="leaderboard-table">
            <tr style="background:#fffbeb;">
                <td><span style="color:#d97706; font-weight:700;">#1</span></td>
                <td><div style="display:flex; align-items:center; gap:10px;"><div style="width:30px; height:30px; background:#fcd34d; border-radius:50%;"></div>Jane</div></td>
                <td style="font-weight:700;">15,400</td>
            </tr>
            <tr>
                <td><span style="color:#9ca3af; font-weight:700;">#2</span></td>
                <td><div style="display:flex; align-items:center; gap:10px;"><div style="width:30px; height:30px; background:#e5e7eb; border-radius:50%;"></div>Tesla Grp</div></td>
                <td style="font-weight:700;">14,200</td>
            </tr>
            <tr style="background:#ecfeff;">
                <td><span style="color:#06b6d4; font-weight:700;">#15</span></td>
                <td><div style="display:flex; align-items:center; gap:10px;"><div style="width:30px; height:30px; background:#06b6d4; border-radius:50%;"></div>You</div></td>
                <td style="font-weight:700; color:#06b6d4;">2,847</td>
            </tr>
        </table>
    </div>

    <h3 class="section-title">Your Groups</h3>
    <div class="groups-grid">
        <div class="group-card">
            <div class="group-header">
                <div class="group-icon">🚗</div>
                <span class="tag tag-green">Member</span>
            </div>
            <div style="margin-bottom:15px;">
                <h3 style="margin:0;">EV Travelers</h3>
                <span style="font-size:0.8rem; color:#64748b;">5 Members</span>
            </div>
            <div class="avatar-stack">
                <div class="stack-img bg-blue">A</div>
                <div class="stack-img bg-green">B</div>
                <div class="stack-img">+3</div>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn-block" style="font-size:0.9rem; padding:10px;">Book</button>
                <button class="btn-outline">Chat</button>
            </div>
        </div>
    </div>
</div>

<footer class="footer"><div class="footer-container"><p>&copy; 2025 ChargeReward Inc.</p></div></footer>
</body>
</html>

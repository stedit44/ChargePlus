    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo"><div class="logo-icon">⚡</div><span>ChargeReward</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-item">Dashboard</a>
            <a href="booking.html" class="nav-item active">Book</a>
            <a href="rewards.html" class="nav-item">Rewards</a>
            <a href="groups.html" class="nav-item">Groups</a>
            <a href="impact.html" class="nav-item">Impact</a>
            <div class="nav-profile">O</div>
        </div>
    </div>
</nav>

<div class="mobile-nav">
    <a href="index.html" class="mobile-nav-item"><span>📊</span> Dashboard</a>
    <a href="booking.html" class="mobile-nav-item active"><span>📍</span> Book</a>
    <a href="rewards.html" class="mobile-nav-item"><span>🎁</span> Rewards</a>
    <a href="groups.html" class="mobile-nav-item"><span>👥</span> Groups</a>
</div>

<div class="main-content">
    <div class="page-heading">
        <h1>Book Experience</h1>
        <p>Find charging, pods, and more.</p>
    </div>

    <div class="filter-container">
        <div class="filter-tabs" id="category-filters">
            <button class="filter-tab active" data-category="charging">⚡ Charging</button>
            <button class="filter-tab" data-category="office">💼 Office</button>
            <button class="filter-tab" data-category="playground">⚽ Play</button>
            <button class="filter-tab" data-category="group_bundles">👥 Bundles</button>
            <button class="filter-tab" data-category="retail">🛒 Retail</button>
        </div>
    </div>

    <div class="materials-section">
        <h3 style="margin-bottom: 15px; font-size: 1.1rem; font-weight: 700;">Pod Standards</h3>
        <div class="materials-grid">
            <div class="mat-item">
                <div class="mat-icon">🔇</div>
                <div><h4 style="font-size:0.95rem;">Silence</h4><p style="font-size:0.8rem; color:#64748b;">Acoustic felt lining.</p></div>
            </div>
            <div class="mat-item">
                <div class="mat-icon">🌿</div>
                <div><h4 style="font-size:0.95rem;">Eco</h4><p style="font-size:0.8rem; color:#64748b;">Sustainable timber.</p></div>
            </div>
            <div class="mat-item">
                <div class="mat-icon">🌬️</div>
                <div><h4 style="font-size:0.95rem;">Air</h4><p style="font-size:0.8rem; color:#64748b;">HEPA-13 filtration.</p></div>
            </div>
        </div>
    </div>

    <div class="booking-grid" id="booking-grid-container"></div>
</div>

<footer class="footer">
    <div class="footer-container">
        <p>&copy; 2025 ChargeReward Inc.</p>
    </div>
</footer>

<script>
    const placesData = {
        charging: [
            { title: "Downtown Hub", img: "images/city1.png", address: "Central Plaza", distance: "0.3 mi", rating: "4.8", label1: "Open", val1: "3/8", label2: "Speed", val2: "150kW", price: "€0.35", points: "1x", btnText: "Charge", bonus: null },
            { title: "Airport Fast", img: "images/airport.jpg", address: "Terminal 2", distance: "2.1 mi", rating: "4.9", label1: "Open", val1: "5/12", label2: "Speed", val2: "250kW", price: "€0.45", points: "2x", btnText: "Charge", bonus: "+50 Pts" },
            { title: "Westside Mall", img: "images/side_of_town.jpg", address: "Mall Area", distance: "4.5 mi", rating: "4.7", label1: "Open", val1: "2/6", label2: "Speed", val2: "150kW", price: "€0.30", points: "1x", btnText: "Charge", bonus: null },
            { title: "Highway Stop", img: "images/highway.jpg", address: "Exit 42", distance: "12.0 mi", rating: "4.5", label1: "Open", val1: "8/10", label2: "Speed", val2: "350kW", price: "€0.40", points: "1.5x", btnText: "Charge", bonus: null }
        ],
        office: [
            { title: "Office Pod", img: "images/office1.jpg", address: "Central Plaza", distance: "0.1 mi", rating: "4.9", label1: "Type", val1: "Solo", label2: "WiFi", val2: "5G", price: "€12/h", points: "350", btnText: "Book", bonus: "Quiet" },
            { title: "Team Box", img: "images/meeting.jpg", address: "Tech Park", distance: "1.5 mi", rating: "4.8", label1: "Type", val1: "4 Ppl", label2: "Screen", val2: "Yes", price: "€25/h", points: "750", btnText: "Book", bonus: null },
            { title: "Station Pod", img: "images/office2_station.jpg", address: "Train Stn", distance: "0.8 mi", rating: "4.7", label1: "Type", val1: "Solo", label2: "Print", val2: "Yes", price: "€15/h", points: "400", btnText: "Book", bonus: null },
            { title: "Hotel Pod", img: "images/office3_hotel.jpg", address: "Grand Hotel", distance: "3.2 mi", rating: "4.9", label1: "Type", val1: "Solo", label2: "Sound", val2: "High", price: "€14/h", points: "350", btnText: "Book", bonus: null }
        ],
        playground: [
            { title: "City Play", img: "images/playground_citypark.jpg", address: "Main Park", distance: "0.2 mi", rating: "4.9", label1: "Age", val1: "3-8", label2: "Safe", val2: "Yes", price: "€10/h", points: "300", btnText: "Book", bonus: "Clean" },
            { title: "Mall Play", img: "images/playground_mall.jpg", address: "Westside", distance: "4.5 mi", rating: "4.8", label1: "Age", val1: "2-6", label2: "Type", val2: "Soft", price: "€8/h", points: "250", btnText: "Book", bonus: null },
            { title: "Beach Play", img: "images/playground_beach.jpg", address: "Promenade", distance: "8.0 mi", rating: "4.9", label1: "Age", val1: "4-10", label2: "View", val2: "Sea", price: "€12/h", points: "350", btnText: "Book", bonus: null }
        ],
        group_bundles: [
            { title: "Team Sprint", img: "images/meeting.jpg", address: "Innovation Dist", distance: "1.5 mi", rating: "5.0", label1: "Get", val1: "4 Pods", label2: "Save", val2: "20%", price: "€45/h", points: "2000", btnText: "Book Bundle", bonus: "Deal" },
            { title: "Kids Party", img: "images/playground_mall.jpg", address: "Westside", distance: "4.5 mi", rating: "4.8", label1: "Get", val1: "3 Boxes", label2: "Save", val2: "15%", price: "€35/h", points: "1500", btnText: "Book Bundle", bonus: "Party" },
            { title: "Hackathon", img: "images/office1.jpg", address: "Train Stn", distance: "0.8 mi", rating: "4.9", label1: "Get", val1: "6 Pods", label2: "Save", val2: "25%", price: "€60/h", points: "3000", btnText: "Book Bundle", bonus: "WiFi+" }
        ],
        retail: [
            { title: "Smart Market", img: "images/retail_smartmarket.jpg", address: "Metro Exit", distance: "0.1 mi", rating: "4.5", label1: "Item", val1: "Food", label2: "Open", val2: "24/7", price: "Shop", points: "Earn", btnText: "Open", bonus: "Fresh" },
            { title: "Tech Vend", img: "images/retail_techairport.jpg", address: "Airport", distance: "2.1 mi", rating: "4.8", label1: "Item", val1: "Tech", label2: "Open", val2: "24/7", price: "Shop", points: "Earn", btnText: "View", bonus: null },
            { title: "Coffee Bot", img: "images/retail_coffeebusiness.jpg", address: "Biz Dist", distance: "0.5 mi", rating: "4.7", label1: "Item", val1: "Coffee", label2: "Wait", val2: "0m", price: "Order", points: "2x", btnText: "Order", bonus: null },
            { title: "Snack Box", img: "images/retail_snackshighway.jpg", address: "Highway", distance: "12.0 mi", rating: "4.4", label1: "Item", val1: "Snack", label2: "Open", val2: "24/7", price: "Shop", points: "Earn", btnText: "Open", bonus: null }
        ]
    };

    const container = document.getElementById('booking-grid-container');
    const tabs = document.querySelectorAll('.filter-tab');

    function renderCards(category) {
        container.innerHTML = '';
        const items = placesData[category];
        items.forEach(item => {
            const bonus = item.bonus ? `<span class="badge-bonus">${item.bonus}</span>` : '';
            container.innerHTML += `
                <div class="booking-card">
                    <div class="card-image-wrapper">
                        ${bonus}
                        <img src="${item.img}" class="card-img" alt="${item.title}">
                    </div>
                    <div class="card-body">
                        <h3 style="margin-bottom:5px; font-size:1.1rem;">${item.title}</h3>
                        <div style="display:flex; justify-content:space-between; font-size:0.85rem; color:#64748b; margin-bottom:15px;">
                            <span>📍 ${item.address}</span>
                            <span>⭐ ${item.rating}</span>
                        </div>
                        <div style="background:#f8fafc; padding:10px; border-radius:8px; display:flex; justify-content:space-between; margin-bottom:15px;">
                            <div><div style="font-size:0.75rem; color:#94a3b8;">${item.label1}</div><div style="font-weight:600;">${item.val1}</div></div>
                            <div style="text-align:right;"><div style="font-size:0.75rem; color:#94a3b8;">${item.label2}</div><div style="font-weight:600; color:#06b6d4;">${item.val2}</div></div>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                            <span style="font-size:1.2rem; font-weight:800;">${item.price}</span>
                            <span style="font-size:0.85rem; color:#64748b;">${item.points}</span>
                        </div>
                        <button class="btn-block">${item.btnText}</button>
                    </div>
                </div>
            `;
        });
    }

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            renderCards(tab.getAttribute('data-category'));
        });
    });
    renderCards('charging');
</script>
</body>
</html>
